version: '3.8'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0  # Versão estável com Zookeeper
    depends_on:
      - zookeeper
    ports:
      - "9093:9093" #porta original e 9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093 #aqui nao deveria ter mas as portas da pr sao bloqueadas  original e 9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093 #porta originla e 9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Adicione esta linha se o erro persistir em versões 7.x:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smartport
    ports:
      - "5433:5432"

  # Opcional: Interface visual para o Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8081:8081"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093 #porta original e 9092
      
      version: '3.8'

  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/configd
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log